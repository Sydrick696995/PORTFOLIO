<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Selected software projects by Sydrick B. Parra, including CareerGraph, C.A.L.I., and data applications." />
    <title>Sydrick B. Parra | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" id="top">
      <div class="container nav-wrap">
        <a href="Home.html" class="brand mono">PERSONAL PORTFOLIO</a>
        <nav class="site-nav" id="siteNav" aria-label="Primary navigation">
          <a href="Home.html" class="mono">HOME</a>
          <a href="About.html" class="mono">ABOUT</a>
          <a href="Projects.html" class="mono">PROJECTS</a>
          <a href="Education.html" class="mono">EDUCATION</a>
          <a href="Journey.html" class="mono">JOURNEY</a>
          <a href="Contact.html" class="mono">CONTACT</a>
        </nav>
        <div class="header-controls">
          <div class="theme-switcher" role="group" aria-label="Theme switcher">
            <button class="theme-btn mono" type="button" data-theme="light">LIGHT</button>
            <button class="theme-btn mono" type="button" data-theme="dark">DARK</button>
            <button class="theme-btn mono" type="button" data-theme="green">GREEN</button>
          </div>
          <button class="menu-toggle mono" id="menuToggle" aria-expanded="false" aria-controls="siteNav" aria-label="Open navigation menu">MENU</button>
        </div>
      </div>
    </header>
    <main id="main-content">
      <!-- SECTION FILE: Projects -->
      <!-- Troubleshooting: featured and grid content are rendered by renderProjects(); keep these IDs unchanged -->
      <section class="section" id="projects">
        <div class="container">
          <h2 class="section-title mono reveal">PROJECTS</h2>
          <article class="featured-project reveal">
            <p class="mono feature-label">FEATURED PROJECT</p>
            <h3 id="featuredProjectName"></h3>
            <p id="featuredProjectSummary"></p>
            <p class="mono small-label">TECHNOLOGIES</p>
            <p id="featuredProjectTech" class="tech-line"></p>
            <div class="project-actions" id="featuredProjectLinks"></div>
          </article>
          <div class="project-explorer reveal" aria-label="Project filters">
            <div class="project-search-wrap">
              <label class="mono" for="projectSearch">FIND A PROJECT</label>
              <input id="projectSearch" type="search" placeholder="Search by technology, project, or topic" autocomplete="off" />
            </div>
            <div class="project-filter-row" role="group" aria-label="Filter projects by category">
              <button class="project-filter is-active mono" type="button" data-filter="ALL" aria-pressed="true">ALL</button>
              <button class="project-filter mono" type="button" data-filter="Web" aria-pressed="false">WEB</button>
              <button class="project-filter mono" type="button" data-filter="Data" aria-pressed="false">DATA</button>
              <button class="project-filter mono" type="button" data-filter="AI" aria-pressed="false">AI</button>
              <button class="project-filter mono" type="button" data-filter="Security" aria-pressed="false">SECURITY</button>
            </div>
            <p id="projectResultCount" class="project-result-count mono" aria-live="polite"></p>
          </div>
          <div class="projects-grid" id="projectsGrid"></div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> <span data-bind="name">Sydrick B. Parra</span></p>
        <p class="mono">Built with JavaScript, HTML & CSS.</p>
        <p class="mono">> keep learning. keep building.</p>
      </div>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
